dependencies:
  idf: '>=5.5.4'

  cpp_bus_driver:
    override_path: "../libraries/cpp_bus_driver"

  private_library:
    override_path: "../libraries/private_library"

  st7701_driver:
    override_path: "../libraries/st7701_driver"
    matches:
      - if: "$CONFIG{EXAMPLE_BUILD_SCREEN} == True"
      - if: "$CONFIG{EXAMPLE_BUILD_SCREEN_LVGL} == True"
      - if: "$CONFIG{EXAMPLE_BUILD_SCREEN_LVGL_TOUCH_DRAW} == True"

  TouchLib:
    override_path: "../libraries/TouchLib"
    matches:
      - if: "$CONFIG{EXAMPLE_BUILD_SCREEN_LVGL_TOUCH_DRAW} == True"

  lvgl/lvgl:
    version: "9.5.0"
    matches:
      - if: "$CONFIG{EXAMPLE_BUILD_SCREEN_LVGL} == True"
      - if: "$CONFIG{EXAMPLE_BUILD_SCREEN_LVGL_TOUCH_DRAW} == True"
